# Example GitHub Actions workflow (copy to .github/workflows/tests.yml to enable).
# Unit tests use synthetic inputs only, so CI needs no data download.
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
